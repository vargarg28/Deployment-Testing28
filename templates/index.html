<!DOCTYPE html>
<html>
<head>
    <title>Hello World App</title>
</head>
<body>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="message"></p>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello World! Welcome to my simple app";
        }
    </script>

</body>
</html>
